version: "3.9"

services:
  gateway:
    build: .
    container_name: easyrdp-gateway
    # 不直接暴露端口到公网，仅在内网供 Nginx 反代访问
    expose:
      - "8443"
    volumes:
      - ./config.toml:/etc/easyrdp/config.toml:ro
      - ./certs:/etc/easyrdp/tls:ro
    environment:
      RUST_LOG: info
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: easyrdp-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
    restart: unless-stopped

