[package]
name = "easyrdp-pixels"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors.workspace = true
description = "EasyRDP 本地帧管线像素处理（BGRA 转换 / 缩放 / 脏矩形 diff）：纯 Rust 基线 + AVX2 SIMD 快速通道 + D3D11 GPU 路径"

[features]
default = []
# SIMD 快速通道（x86_64 AVX2/SSSE3 intrinsics + is_x86_feature_detected 运行时检测 + 纯 Rust 回退）
gpu-accel = []
# D3D11 VideoProcessor GPU 缩放/格式转换（设备创建失败自动回退 CPU/SIMD）
d3d = ["dep:windows"]

# D3D11 GPU 路径（`d3d` feature）：windows-sys 0.61 已移除 D3D11/DXGI，改用 windows crate
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
