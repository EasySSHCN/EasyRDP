[workspace]
resolver = "2"
members = [
    "crates/easyrdp-core",
    "crates/easyrdp-rdp",
    "src-tauri",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license = "MIT"
authors = ["EasyRDP Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
thiserror = "1"
