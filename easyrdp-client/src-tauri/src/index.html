<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=.1" />
  <title>EasyRDP</title>
  <link rel="stylesheet" href="ui/style.css" />
</head>
<body>
  <header>
    <h1>EasyRDP <span class="tag">MVP</span></h1>
    <p class="subtitle">跨平台远程桌面客户端 · Tauri 2 + FreeRDP</p>
  </header>

  <main>
    <section class="card">
      <h2>导入 .rdp 配置</h2>
      <div class="row">
        <input id="rdp-path" type="text" placeholder="mstsc 导出的 .rdp 文件绝对路径" />
        <button id="btn-import">导入</button>
        <button id="btn-list">列出配置</button>
      </div>
      <pre id="output" class="output">// 结果显示在这里</pre>
    </section>
  </main>

  <script type="module" src="ui/main.js"></script>
</body>
</html>
