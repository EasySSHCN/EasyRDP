[package]
name = "easyrdp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EasyRDP Tauri 2 application shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
easyrdp-core = { path = "../crates/easyrdp-core" }
easyrdp-rdp = { path = "../crates/easyrdp-rdp" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# 发布构建必须启用 custom-protocol（嵌入前端资源）；
# 否则 tauri 的 dev = !custom_protocol 会以 dev 模式编译，运行时去连 devUrl(localhost:5173)。
# 构建命令：cargo build --release -p easyrdp-app --features custom-protocol
[features]
custom-protocol = ["tauri/custom-protocol"]
