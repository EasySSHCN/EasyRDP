# EasyRDP CI workflow
# 触发：push / PR 到 main 分支
# 三平台矩阵：cargo test --workspace + 发布模式构建（不发布产物）。
# 构建命令使用显式的
#   cargo build --release -p easyrdp-app --features custom-protocol
# custom-protocol 必须启用：否则 tauri 以 dev 模式编译，运行时会连 localhost:5173 白屏。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLIENT_DIR: easyrdp-client
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CLIENT_DIR }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run tests (workspace)
        run: cargo test --workspace
        working-directory: ${{ env.CLIENT_DIR }}

      - name: Build release (custom-protocol enabled)
        run: cargo build --release -p easyrdp-app --features custom-protocol
        working-directory: ${{ env.CLIENT_DIR }}
