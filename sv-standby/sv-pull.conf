# =============================================================================
# sv-pull.conf — sv 备用服务器拉取同步配置（含服务器地址，机密，勿外泄/勿入库）
# 部署位置: sv.trae.show:/opt/dsh/sv-standby/sv-pull.conf
# =============================================================================
# ---------------- 拉取私钥（sv 本机生成，公钥已授权到两台正式机，restrict+from 限源） ----------------
PULL_KEY="/root/.ssh/id_ed25519_svpull"
SYNC_LETSENCRYPT="yes"

# ---------------- EasyRDP 主服务器（域名直连，弃用 IP） ----------------
PRIMARY_EASYRDP_HOST="easyrdp.cn"
PRIMARY_EASYRDP_PORT="22"
PRIMARY_EASYRDP_USER="root"
EASYRDP_WEBROOT="/www/wwwroot/easyrdp.cn"
EASYRDP_DATA_DIR="/www/wwwroot/easyrdp-data"
EASYRDP_CERT_DIR="/www/server/panel/vhost/cert/easyrdp.cn"   # 宝塔 acme.sh 部署路径
SV_EASYRDP_CERT_DIR="/www/server/panel/vhost/cert/easyrdp.cn"
EASYRDP_EXCLUDES="--exclude=api/feedback/uploads/"

# ---------------- EasySSH 主服务器（la 发布机，端口 4685） ----------------
PRIMARY_EASYSSH_HOST="la.trae.show"
PRIMARY_EASYSSH_PORT="4685"
PRIMARY_EASYSSH_USER="root"
EASYSSH_WEBROOT="/www/wwwroot/easyssh.cn"
EASYSSH_DATA_DIR="/www/wwwroot/data"
EASYSSH_CERT_DIR="/www/server/panel/vhost/cert/easyssh.cn"
SV_EASYSSH_CERT_DIR="/www/server/panel/vhost/cert/easyssh.cn"
EASYSSH_EXCLUDES="--exclude=api/feedback/uploads/ --exclude=data/stats-*"

# ---------------- sv 端目标目录（两项目完全独立，互不覆盖） ----------------
SV_EASYRDP_WEBROOT="/www/wwwroot/easyrdp.cn"
SV_EASYRDP_DATA_DIR="/www/wwwroot/easyrdp-data"
SV_EASYSSH_WEBROOT="/www/wwwroot/easyssh.cn"
SV_EASYSSH_DATA_DIR="/www/wwwroot/data"

# ---------------- 拉取 cron（每 6 小时，错峰；--install-cron 时使用） ----------------
CRON_PULL_CRON="17 */6 * * * /opt/dsh/sv-standby/sv-pull.sh --project easyrdp --incr >> /var/log/sv-sync/pull-easyrdp.log 2>&1"
CRON_PULL_CRON2="47 */6 * * * /opt/dsh/sv-standby/sv-pull.sh --project easyssh --incr >> /var/log/sv-sync/pull-easyssh.log 2>&1"
