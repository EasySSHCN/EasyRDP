# 构建（与环境固化，复用网关 .cargo 同款方案）：ring/aws-lc-sys 的 cc-rs 在超长
# target 路径下触发 MSVC cl.exe D8050（命令行无法写入调试记录）。本配置把本
# crate 的构建级 target 固定到短路径 C:/erdp-tgt，规避该问题；仅当 cargo 在
# easyrdp-agent 目录内运行时生效，不影响 workspace 其他 crate 与全局环境。
# ring 0.17 与网关侧 rustls 0.23(ring) 为同一依赖树，共用 C:/erdp-tgt 缓存。
[build]
target-dir = "C:/erdp-tgt"
