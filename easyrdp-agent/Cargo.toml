[package]
name = "easyrdp-agent"
version = "0.1.0"
edition = "2021"
description = "EasyRDP 目标机 Agent：反向注册到云网关（WSS /agent/connect），本地转发 RDP 后端"
license = "Apache-2.0"

[dependencies]
# 运行时与 WS：与 easyrdp-gateway 同版本线（R-20261122-006 P3：不引新栈），
# tokio-tungstenite 0.21 + rustls(ring, webpki-roots) —— 复用网关侧 rustls 0.23 依赖树。
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# DPAPI 落盘（Windows）：CryptProtectData/CryptUnprotectData + LocalFree
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }
# Windows 服务形态：SCM dispatcher + 控制处理器
windows-service = "0.7"

[[bin]]
name = "easyrdp-agent"
path = "src/main.rs"
